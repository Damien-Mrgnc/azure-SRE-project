# InfraCI workflow

name: Infra CI
on:
  push:
    branches: 
      - main
      - feat/**
      - 'phase-**'
    paths:
      - 'terraform/**'
      - '.github/workflows/infra-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/infra-ci.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_alert_email: "${{ secrets.ALERT_EMAIL }}"

jobs:
  terraform-fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate

  security-scan:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    needs: [terraform-fmt, terraform-validate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform
          framework: terraform
          quiet: true
          soft_fail: true

  terraform-plan:
    name: Terraform Plan Execution
    runs-on: ubuntu-latest
    needs: security-scan
    environment: production 
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log into Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Terraform Init (With Azure Backend)
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true
        run: terraform init
      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true
        run: terraform plan -out=tfplan -lock=false

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase-') || startsWith(github.ref, 'refs/heads/feat/')) && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log into Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true
        run: terraform init

      # ---------------------------------------------------------------
      # Fix permanent : importer les secrets KV s'ils existent déjà dans Azure
      # mais pas dans l'état Terraform (évite l'erreur "already exists").
      # Le '|| true' ignore l'erreur si le secret n'existe pas encore (1er déploiement).
      # ---------------------------------------------------------------
      - name: Import existing Key Vault secrets (idempotent)
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true
        run: |
          # Récupérer le nom du Key Vault depuis le state Terraform
          KV_NAME=$(terraform output -raw key_vault_name 2>/dev/null || echo "")

          if [ -n "$KV_NAME" ]; then
            echo "Key Vault trouvé : $KV_NAME — tentative d'import des secrets existants..."
            BASE_URL="https://${KV_NAME}.vault.azure.net/secrets"

            terraform import azurerm_key_vault_secret.sql_password         "${BASE_URL}/sql-admin-password"       || true
            terraform import azurerm_key_vault_secret.sql_connection_string "${BASE_URL}/sql-connection-string"   || true
            terraform import azurerm_key_vault_secret.redis_connection_string "${BASE_URL}/redis-connection-string" || true
            terraform import azurerm_key_vault_secret.grafana_admin_password "${BASE_URL}/grafana-admin-password"  || true
          else
            echo "Aucun Key Vault dans le state (premier déploiement) — import ignoré."
          fi

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true
        run: terraform apply -auto-approve -lock=false

